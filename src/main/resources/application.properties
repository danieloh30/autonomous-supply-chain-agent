# Optional AI analysis. The guided demo works without a model credential.
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:demo-not-configured}
quarkus.langchain4j.openai.chat-model.temperature=0.2
quarkus.langchain4j.openai.chat-model.model-name=${OPENAI_MODEL:gpt-4o-mini}
quarkus.langchain4j.openai.timeout=PT3M
quarkus.langchain4j.log-requests=false
quarkus.langchain4j.log-responses=false

# Local demo shipping API. Override when using a separately hosted service.
quarkus.rest-client.shipping-api.url=${SHIPPING_API_URL:http://localhost:${quarkus.http.port:8080}}
quarkus.rest-client.shipping-api.scope=jakarta.inject.Singleton
quarkus.rest-client.shipping-api.connect-timeout=5000
quarkus.rest-client.shipping-api.read-timeout=10000
%test.quarkus.rest-client.shipping-api.url=http://localhost:${quarkus.http.test-port:8081}
%test.quarkus.langchain4j.openai.api-key=demo-not-configured
%test.quarkus.http.test-port=8082
