name: Java CI with Maven

env:
  JVM_VERSION: '25'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: "workflow = ${{ github.workflow }}, ref = ${{ github.event.ref }}, pr = ${{ github.event.pull_request.id }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    name: "Build autonomous-supply-chain-agent"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: "Set up JDK 25"
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/main/webui/package-lock.json
      - name: Install frontend dependencies
        working-directory: src/main/webui
        run: npm ci
      - name: Test frontend
        working-directory: src/main/webui
        run: npm test
      - name: Build frontend assets
        working-directory: src/main/webui
        run: npm run build
      - name: Maven Build
        run: ./mvnw -B verify -Dquarkus.http.host=0.0.0.0

  dependabot:
    needs: build
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve and enable auto-merge for Dependabot PRs
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL" || echo "Auto-merge not available. PR approved and ready for manual merge."
